<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>places</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css" /> 
    <link rel="stylesheet" href="style.css" /> 
</head>
<body>
    <!--NAV BAR-->
    <nav>
        <ul class="navitems">
            <li class="navlink"><a href="index.html">home</a></li>
            <img class="icon" src="img/icon.png">
            <li class="navlink"><a href="poster-making/index.html">posters</a></li>
        </ul>
    </nav>

    <div class="section-grid">

         <!-- Left Section -->
        <section class="leftsec">
            <!-- IMG BOX -->
            <div id="imgBox">
               

                
            </div>
            <div class="horizontal-flex">
                <div>
                    <!-- CAPTION INFO -->
                    <h2 id="country">countryname</h2>

                        <div class="horizontal-text">
                            <h1 id="city">city</h1>
                            <h1 id="state">state</h1>
                        </div>

                    <h3 id="lat">latitude:</h3>
                    <h3 id="long">longitude:</h3>
                    </div>
                <div>
                    <!-- CAPTION PARAGRAPH -->
                    <h2 id="visitReason">visiting text goes here visiting text goes here visiting text goes here visiting text goes here visiting text goes here</h2>
                </div>
            </div>
        </section>

        <!-- Right Section -->
        <section class="rightsec">
            <h1 class="header">places</h1>
                <div class="section-grid-places">
                    <div class="leftcol">
                        <div class="placeitems">
                            <h2>usa</h2>
                            <ul>
                                <li id="places">
                                    <button data-city="Atlanta">atlanta</button>
                                    <button data-city="Birmingham">birmingham</button>
                                    <button data-city="Chattanooga">chattanooga</button>
                                    <button data-city="Colorado Springs">colorado springs</button>
                                    <button data-city="Denver">denver</button>
                                    <button data-city="Grand Canyon National Park">grand canyon</button>
                                    <button data-city="Hilton Head">hilton head</button>
                                    <button data-city="Miami">miami</button>
                                    <button data-city="New York City">new york city</button>
                                    <button data-city="Niagara Falls">niagara falls</button>
                                    <button data-city="Orange Beach">orange beach</button>
                                    <button data-city="Orlando">orlando</button>
                                    <button data-city="Pensacola">pensacola</button>
                                    <button data-city="Philadelphia">philadelphia</button>
                                    <button data-city="Phoenix">phoenix</button>
                                    <button data-city="Rosemary Beach">rosemary beach</button>
                                    <button data-city="Vero Beach">vero beach</button>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="rightcol">
                        <div class="placeitems">
                            <h2>europe</h2>
                            <ul>
                                <li id="places">
                                    <button data-city="Amsterdam">amsterdam</button>
                                    <button data-city="Dornbirn">dornbirn</button>
                                    <button data-city="Florence">florence</button>
                                    <button data-city="Lindau">lindau</button>
                                    <button data-city="Lisbon">lisbon</button>
                                    <button data-city="Pisa">pisa</button>
                                    <button data-city="Rome">rome</button>
                                    <button data-city="Vatican City">vatican city</button>
                                </li>
                            </ul>
                        </div>
                        <div class="placeitems">
                            <h2>north/central america</h2>
                                <ul>
                                    <li id="places">
                                        <button data-city="Liberia">liberia</button>
                                        <button data-city="Nassau">nassau</button>
                                    </li>
                                </ul>
                        </div>

                        <div class="placeitems">
                            <h2>asia</h2>
                                <ul>
                                    <li id="places">
                                        <button data-city="Tokyo">tokyo</button>
                                    </li>
                                </ul>
                        </div>
                    </div>    
                </div>
            <!-- FILTERS -->
            <div class="filter-box">
                <label>
                    <input type="radio" id="showAll" value="active" name="filters">
                    show all
                </label>
                <label>
                    <input type="radio" id="showEastUS" name="filters">
                    east u.s
                </label>
                <label>
                    <input type="radio" id="showWestUS" name="filters">
                    west u.s
                </label>
                <label>
                    <input type="radio" id="showVisitingSoon" name="filters">
                    visiting soon
                </label>
                <label>
                    <input type="radio" id="showFavorites" name="filters">
                    favorites
                </label>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
